<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <title>poormansCLIMAP – SwissMetNet Viewer</title>

    <!-- Tailwind local -->
    <link rel="stylesheet" href="libs/tailwind/tailwind.css" />

    <!-- Leaflet local -->
    <link rel="stylesheet" href="libs/leaflet/leaflet.css" />
    <script src="libs/leaflet/leaflet.js"></script>

    <!-- Proj4 -->
    <script src="libs/proj4/proj4.js"></script>

    <!-- ECharts -->
    <script src="libs/echarts/echarts.min.js"></script>

    <style>
        body {
            background: #f3f4f6;
        }
        #map {
            height: 600px;
        }
        .loader {
            border: 4px solid #eee;
            border-radius: 50%;
            border-top: 4px solid #2563eb;
            width: 26px;
            height: 26px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Triangolo per stazioni NIME */
        .nime-marker {
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 18px solid #ffffff;
            border-radius: 2px;
        }

        /* Barbule vento */
        .wind-barb {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wind-barb-line {
            width: 3px;
            height: 28px;
            background: #111;
            position: relative;
        }
        .wind-barb-line::after {
            content: "";
            position: absolute;
            top: -4px;
            left: -3px;
            border-width: 4px 3px 0 3px;
            border-style: solid;
            border-color: #111 transparent transparent transparent;
        }
    </style>
</head>

<body class="p-6">

    <h1 class="text-3xl font-bold mb-3">poormansCLIMAP – SwissMetNet Viewer</h1>

    <div class="flex flex-wrap gap-4 mb-4 items-end">

        <!-- PARAM -->
        <div>
            <label class="text-sm font-semibold block mb-1">Parametro:</label>
            <select id="paramSelect" class="border rounded p-2 w-72 text-sm"></select>
        </div>

        <!-- DATASET -->
        <div>
            <label class="text-sm font-semibold block mb-1">Dataset:</label>
            <select id="intervalSelect" class="border rounded p-2 w-36 text-sm">
                <option value="d">Giornaliero (d)</option>
                <option value="h">Orario (h)</option>
                <option value="m">Mensile (m)</option>
            </select>
        </div>

        <!-- DATE -->
        <div>
            <label class="text-sm font-semibold block mb-1">Data:</label>
            <input id="dateInput" type="date" class="border rounded p-2 w-40 text-sm" />
        </div>

        <!-- Loader -->
        <div id="loading" class="hidden flex items-center gap-2 text-sm">
            <div class="loader"></div> Carico dati…
        </div>
    </div>

    <div id="status" class="text-sm text-gray-700 mb-3"></div>

    <!-- MAP -->
    <div id="map" class="border rounded bg-white"></div>

    <!-- METADATA PANEL -->
    <div id="metaPanel" class="mt-6 hidden border rounded bg-white p-4 shadow">
        <h2 id="metaTitle" class="text-xl font-bold mb-2"></h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

            <div class="text-sm">
                <p><b>Codice:</b> <span id="m_code"></span></p>
                <p><b>Rete:</b> <span id="m_type"></span></p>
                <p><b>Altitudine:</b> <span id="m_alt"></span> m</p>
            </div>

            <div class="text-sm">
                <p><b>LV95:</b> <span id="m_lv95"></span></p>
                <p><b>WGS84:</b> <span id="m_wgs84"></span></p>
            </div>
        </div>

        <h3 class="font-semibold mb-1">Ultimo valore disponibile:</h3>
        <p id="m_value" class="mb-3 text-lg"></p>

        <h3 class="font-semibold mb-1">Serie temporale:</h3>
        <div id="chartContainer" style="height:320px;" class="border rounded"></div>
        <p id="chartStatus" class="text-xs text-gray-500 mt-1"></p>
    </div>

    <!-- MeteoSwiss config -->
    <script src="config.js"></script>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        if (!window.METEO_CONFIG) {
            alert("config.js non trovato!");
            return;
        }

        METEO_CONFIG.initializeProj4Defs();

        // MAP INIT -------------------------
        let map = L.map("map").setView([46.7, 8.2], 8);

        const wmts = L.tileLayer(
            "https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-grau/default/current/3857/{z}/{x}/{y}.jpeg",
            { maxZoom: 18 }
        ).on("tileerror", () => {
            console.warn("WMTS bloccato → fallback OSM");
            map.removeLayer(wmts);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
        });

        wmts.addTo(map);

        let layerGroup = L.layerGroup().addTo(map);

        const stations = METEO_CONFIG.stations;
        const paramMap = METEO_CONFIG.parameterMap;

        // DOM elements
        const paramSelect = document.getElementById("paramSelect");
        const intervalSelect = document.getElementById("intervalSelect");
        const dateInput = document.getElementById("dateInput");
        const statusEl = document.getElementById("status");
        const loadingEl = document.getElementById("loading");

        const metaPanel = document.getElementById("metaPanel");
        const m_code = document.getElementById("m_code");
        const m_type = document.getElementById("m_type");
        const m_alt = document.getElementById("m_alt");
        const m_lv95 = document.getElementById("m_lv95");
        const m_wgs84 = document.getElementById("m_wgs84");
        const m_value = document.getElementById("m_value");
        const metaTitle = document.getElementById("metaTitle");

        let chart = echarts.init(document.getElementById("chartContainer"));

        // Auto-set date = yesterday
        const d = new Date();
        d.setDate(d.getDate() - 1);
        dateInput.value = d.toISOString().slice(0,10);

        // Cache CSV
        const cache = {};

        async function loadCSV(st, interval) {
            const key = st + "_" + interval;
            if (cache[key]) return;

            const S = stations[st];
            if (!S.dataSource) return; // OASI

            const base = `https://data.geo.admin.ch/ch.meteoschweiz.${S.dataSource}/${st.toLowerCase()}/ch.meteoschweiz.${S.dataSource}_${st.toLowerCase()}`;
            let urls = [];

            if (interval === "d") {
                urls = [`${base}_d_historical.csv`, `${base}_d_recent.csv`];
            } else if (interval === "m") {
                urls = [`${base}_m.csv`];
            } else {
                urls = [`${base}_t_recent.csv`];
                const cy = new Date().getFullYear();
                const d0 = cy - (cy % 10);
                for (let y = d0; y >= 1980; y -= 10) {
                    urls.push(`${base}_t_historical_${y}-${y+9}.csv`);
                }
            }

            let headers = null;
            let rows = [];

            for (const url of urls) {
                try {
                    const r = await fetch(url);
                    if (!r.ok) continue;
                    const text = await r.text();
                    const lines = text.split("\n").filter(x => x.trim() !== "");
                    if (!lines.length) continue;

                    const h = lines[0].split(";").map(x => x.trim());
                    if (!headers) headers = h;

                    for (const line of lines.slice(1)) {
                        rows.push(line.split(";").map(x => x.trim()));
                    }
                } catch {}
            }

            cache[key] = { headers, rows };
        }

        // Build parameter list
        async function buildParamList() {
            paramSelect.innerHTML = "";

            const interval = intervalSelect.value;
            const suffix = interval + "0";
            const sample = Object.keys(stations).slice(0, 20);

            const found = new Set();

            for (const s of sample) {
                await loadCSV(s, interval);
                const key = s + "_" + interval;
                const c = cache[key];
                if (!c || !c.headers) continue;

                for (const h of c.headers) {
                    if (paramMap[h]) found.add(h);
                }
            }

            [...found]
                .sort((a,b) => paramMap[a].name.localeCompare(paramMap[b].name))
                .forEach(code => {
                    const opt = document.createElement("option");
                    opt.value = code;
                    opt.textContent = paramMap[code].name + " (" + paramMap[code].unit + ")";
                    paramSelect.appendChild(opt);
                });
        }

        function parseDate(t) {
            if (!t) return null;
            const [dmy, hm] = t.split(" ");
            const [dd, mm, yy] = dmy.split(".");
            let h=0, m=0;
            if (hm) [h, m] = hm.split(":");
            return new Date(yy, mm - 1, dd, h || 0, m || 0);
        }

        function getValue(st, param, dateISO) {
            const key = st + "_" + intervalSelect.value;
            const c = cache[key];
            if (!c) return null;

            const idxV = c.headers.indexOf(param);
            if (idxV < 0) return null;

            const idxT = 1;

            for (const r of c.rows) {
                const t = r[idxT];
                const [dd, mm, yy] = t.split(" ")[0].split(".");
                const iso = `${yy}-${mm}-${dd}`;
                if (iso === dateISO) {
                    const v = parseFloat(r[idxV].replace(",", "."));
                    return isNaN(v) ? null : v;
                }
            }
            return null;
        }

        function iconForStation(S) {
            if (S.type === "OASI") {
                return L.circleMarker([0,0], {radius:8}); // will set coords later
            }
            if (S.type === "SMN") {
                return L.circleMarker([0,0], {radius:7, fillColor:"#2374ff", fillOpacity:0.9, color:"#143f99"});
            }
            if (S.type === "SMN-precip") {
                return L.circleMarker([0,0], {radius:7, fillColor:"#2ecc71", fillOpacity:0.9, color:"#1b8c4a"});
            }
            if (S.type === "NIME") {
                return L.marker([0,0], {
                    icon: L.divIcon({
                        className:"nime-marker",
                        iconSize:[20,20],
                        iconAnchor:[10,10]
                    })
                });
            }
        }

        function updateMap() {
            const param = paramSelect.value;
            const interval = intervalSelect.value;
            const dateISO = dateInput.value;

            if (!param) return;

            layerGroup.clearLayers();
            statusEl.textContent = "Aggiorno mappa…";

            const values = [];
            const perStation = {};

            const promises = Object.keys(stations).map(st => loadCSV(st, interval));

            Promise.all(promises).then(() => {
                for (const st of Object.keys(stations)) {
                    const S = stations[st];
                    if (S.dataSource) {
                        const v = getValue(st, param, dateISO);
                        if (v != null) {
                            values.push(v);
                            perStation[st] = v;
                        }
                    }
                }

                const min = Math.min(...values);
                const max = Math.max(...values);

                for (const st of Object.keys(stations)) {
                    const S = stations[st];

                    const [lon,lat] = proj4("EPSG:2056","EPSG:4326",[S.east,S.north]).reverse();

                    const marker = iconForStation(S);
                    marker.setLatLng([lat,lon]);

                    const v = perStation[st];
                    if (v != null) {
                        const t = (v - min) / (max - min || 1);
                        const color = `rgb(${Math.round(255*t)},0,${Math.round(255*(1-t))})`;

                        if (marker.setStyle) {
                            marker.setStyle({ fillColor: color });
                        }
                    }

                    marker.bindTooltip(`
                        <b>${S.name}</b> (${st})<br>
                        ${paramMap[param].name}: ${v ?? 'n.d.'} ${paramMap[param].unit}
                    `);

                    marker.on("click", () => showStationDetails(st));

                    layerGroup.addLayer(marker);
                }

                statusEl.textContent = "OK.";
            });
        }

        function showStationDetails(st) {
            const S = stations[st];
            const param = paramSelect.value;
            const dateISO = dateInput.value;

            metaPanel.classList.remove("hidden");

            metaTitle.textContent = S.name;
            m_code.textContent = st;
            m_type.textContent = S.type;
            m_alt.textContent = S.altitude;
            m_lv95.textContent = `${S.east}, ${S.north}`;

            const [lon,lat] = proj4("EPSG:2056","EPSG:4326",[S.east,S.north]).reverse();
            m_wgs84.textContent = lat.toFixed(5) + ", " + lon.toFixed(5);

            const v = getValue(st, param, dateISO);
            m_value.textContent = v != null ? `${v} ${paramMap[param].unit}` : "n.d.";

            drawTimeSeries(st);
        }

        function drawTimeSeries(st) {
            const param = paramSelect.value;
            const c = cache[st + "_" + intervalSelect.value];
            if (!c) return;

            const idxV = c.headers.indexOf(param);
            const idxT = 1;

            const data = [];

            for (const r of c.rows) {
                const d = parseDate(r[idxT]);
                if (!d) continue;
                const v = parseFloat(r[idxV]?.replace(",","."));
                if (!isNaN(v)) data.push([d, v]);
            }

            data.sort((a,b) => a[0]-b[0]);

            chart.setOption({
                tooltip:{ trigger:"axis" },
                xAxis:{ type:"time" },
                yAxis:{ type:"value", name:paramMap[param].unit },
                series:[{ type:"line", showSymbol:false, data:data }]
            });

            chart.resize();
        }

        // INIT
        (async () => {
            await buildParamList();
            updateMap();
        })();

        paramSelect.addEventListener("change", updateMap);
        intervalSelect.addEventListener("change", async () => {
            await buildParamList();
            updateMap();
        });
        dateInput.addEventListener("change", updateMap);
    });
    </script>

</body>
</html>
